<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Fragging in Texas</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/styles2.css">
    <link rel="stylesheet" href="./css/text.css">
    <link rel="stylesheet" href="./css/fire.css">
</head>
<body class="app-container">
    <canvas id="emberCanvas"></canvas>
    <header class="app-header">
        <div class="header-controls">
            <button id="audioBtn" class="icon-btn" title="Toggle Wind Ambience">
                <img id="audioOnIcon" src="./svg/speaker/s_on.svg" width="24" height="24" class="hidden" alt="Sound On">
                <img id="audioOffIcon" src="./svg/speaker/s_off.svg" width="24" height="24" alt="Sound Off">
                <span id="audioLabel" class="label-sm">Ambience</span>
            </button>
            <button id="textSizeBtn" class="icon-btn" title="Adjust Text Size">
                <span class="text-xs">A</span>
                <span class="text-base">A</span>
            </button>
            <button id="fullscreenBtn" class="icon-btn" title="Toggle Fullscreen">
                <img src="./svg/fullscreen_icon.svg" width="24" height="24" alt="Toggle Fullscreen">
            </button>
        </div>
    </header>
    <main id="tapArea" class="story-container">
        <div id="slideBox" class="slide-box fade-enter-active">
            <h1 id="slideTitle" class="slide-title title-font text-glow hidden"></h1>
            <div id="slideContent" class="slide-content"></div>
            <p id="slideSubtitle" class="slide-subtitle ui-font hidden"></p>
        </div>
        <div id="tapHint" class="tap-hint ui-font">
            <span>Tap screen or press space</span>
            <img src="./svg/arrow/a_right.svg" width="24" height="24" alt="Next">
        </div>
        <div id="endControls" class="end-controls hidden">
            <button id="restartBtn" class="primary-btn ui-font">
                <img src="./svg/read_again.svg" width="24" height="24" alt="Restart">
                Read Again
            </button>
        </div>
    </main>
    <footer class="app-footer">
        <div class="progress-track">
            <div id="progressBar" class="progress-fill"></div>
        </div>
        <div class="footer-nav ui-font">
            <button id="prevBtn" class="nav-btn">
                <img src="./svg/arrow/a_left.svg" width="24" height="24" alt="Back">
                <span>Back</span>
            </button>
            <div id="slideCounter" class="slide-counter">
                1 / --
            </div>
            <button id="nextBtn" class="nav-btn">
                <span>Next</span>
                <img src="./svg/arrow/a_right.svg" width="24" height="24" alt="Next">
            </button>
        </div>
    </footer>
    <script src="./js/fire.js"></script>
    <script src="./js/wind.js"></script>
    <script src="./js/fullscreen.js"></script>
    <script src="./js/fontsize.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
